name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: Static contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  browser:
    name: Browser checks (Chromium + WebKit)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.64.1
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
        env:
          CHECK_WEBKIT: '1'
          SCREENSHOT_DIR: ${{ runner.temp }}/carousel-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carousel-screenshots
          path: ${{ runner.temp }}/carousel-qa
          if-no-files-found: ignore
