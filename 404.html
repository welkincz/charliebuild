<style>
  :root {
    --paper: #F6F7F5; --ink: #1B222B; --muted: #586371; --faint: #626D7A;
    --rule: #D9DDD8; --signal: #8A6A1C; --focus: #2F5FA8;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14181D; --ink: #E2E5E8; --muted: #A2ABB5; --faint: #848E99;
      --rule: #303740; --signal: #D0A64C; --focus: #82ADE7;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: grid; place-items: center;
    padding: 2rem clamp(1rem, 5vw, 4.5rem);
    background: var(--paper); color: var(--ink);
    font-family: "Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  main { width: min(100%, 40rem); }
  .code {
    margin: 0; color: var(--faint);
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
  }
  h1 {
    margin: 0.6rem 0 0; font-size: clamp(2.4rem, 7vw, 4rem); font-weight: 680;
    letter-spacing: -0.05em; line-height: 1.02;
  }
  p { color: var(--muted); max-width: 38ch; }
  ul { display: flex; flex-wrap: wrap; gap: 0.5rem 1.6rem; margin: 2rem 0 0; padding: 1rem 0 0; list-style: none; border-top: 1px solid var(--rule); font-size: 0.9rem; }
  a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--signal); }
  a:hover { border-bottom-color: var(--ink); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
</style>
</head>
